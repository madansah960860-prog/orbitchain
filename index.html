<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />

    <title>Orbit Chain Co. — Accessories for Apple Devices</title>
    <meta
      name="description"
      content="Independent reseller of cables, chargers, cases, bands and audio accessories for Apple devices. Compatibility checked per model, 30-day returns, tracked US shipping."
    />
    <link rel="canonical" href="https://www.shoporbitchain.us/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbit Chain Co." />
    <meta property="og:title" content="Orbit Chain Co. — Accessories for Apple Devices" />
    <meta
      property="og:description"
      content="Independent reseller of cables, chargers, cases, bands and audio accessories for Apple devices."
    />
    <meta property="og:image" content="https://www.shoporbitchain.us/images/r/hero-primary-1280.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Fonts are self-hosted (public/fonts) and declared in the CSS
         bundle. Preloading them here starts both downloads in the same
         round trip as the HTML, instead of waiting for the CSS to parse. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Archivo-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/AzeretMono-latin.woff2" crossorigin />
    <!-- No static hero preload. This SPA serves one index.html for every
         route, so a preload here would download the homepage hero on
         /shop and /product too — the pages ads actually land on. The
         hero <img> carries fetchpriority="high" instead, which starts
         the fetch as soon as React paints and costs nothing elsewhere. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Orbit Chain Co.",
        "url": "https://www.shoporbitchain.us/",
        "description": "Independent third-party reseller of accessories compatible with Apple devices. Not affiliated with, endorsed by, or sponsored by Apple Inc.",
        "currenciesAccepted": "USD",
        "paymentAccepted": "Credit Card, Debit Card",
        "areaServed": "US"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #fff; background: #0a0a0b">
        <h1>Orbit Chain Co.</h1>
        <p>
          This store needs JavaScript enabled to browse the catalog. You can reach us at
          <a style="color: #7db4ff" href="mailto:support@shoporbitchain.us"
            >support@shoporbitchain.us</a
          >.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
